<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gold Coast Parking — Valet Parking Maps</title>
<meta name="description" content="Interactive valet parking maps — Gold Coast Parking, St Tropez by the Bay. Tap a spot: green = available, red = not available. Shared live across devices.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GC Parking">
<style>
  :root{
    --bg:#0a0806; --bg2:#14110b; --card:#171410; --card2:#1c1813; --line:#2e2820;
    --ink:#f3eee3; --muted:#a99e8a; --faint:#6f6450;
    --green:#22b573; --red:#e5484d; --gold:#c0a35f; --gold-l:#d8bc7a;
    --radius:18px; --ease:cubic-bezier(.22,.9,.28,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);min-height:100vh;padding-bottom:92px}
  .appbar{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold-l) 50%,var(--gold) 70%,transparent) 1}
  .appbar-in{max-width:1060px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .brandlogo{height:58px;width:auto;display:block;flex:none}
  .ttl{line-height:1.15;min-width:0}
  .ttl b{font-size:1.02rem;font-weight:800;letter-spacing:.01em;display:block}
  .ttl span{font-size:.72rem;color:var(--gold);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .sync{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:.76rem;font-weight:700;color:var(--muted);flex:none}
  .sync i{width:8px;height:8px;border-radius:50%;background:#f5b83d;display:block}
  .sync.live{color:#b9f4dd}.sync.live i{background:#2ee59d;box-shadow:0 0 9px #2ee59d}
  .sync.off{color:#ffc9cb}.sync.off i{background:var(--red)}
  .wrap{max-width:1060px;margin:0 auto;padding:16px 14px 0}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:5px;gap:5px}
  .seg + .seg{margin-top:10px}
  .seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:.98rem;padding:11px 8px;border-radius:11px;cursor:pointer;transition:all .22s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px}
  .seg button.on{background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#171106;box-shadow:0 8px 18px -8px rgba(192,163,95,.8)}
  .seg .cnt{font-size:.74rem;font-weight:800;background:rgba(255,255,255,.16);border-radius:99px;padding:2px 8px}
  .seg button:not(.on) .cnt{background:rgba(192,163,95,.13);color:var(--muted)}
  .seg .cnt b{color:#2ee59d;font-weight:800}
  .seg button.on .cnt b{color:#0d5c39}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px 11px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;top:0;left:16px;right:16px;height:3px;border-radius:99px;background:var(--faint);opacity:.35}
  .stat.g::before{background:var(--green);opacity:1;box-shadow:0 2px 12px rgba(34,181,115,.55)}
  .stat.r::before{background:var(--red);opacity:1;box-shadow:0 2px 12px rgba(229,72,77,.5)}
  .stat b{font-size:1.55rem;font-weight:850;line-height:1;display:block;font-variant-numeric:tabular-nums}
  .stat span{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-top:5px}
  .mapcard{margin-top:12px;background:linear-gradient(180deg,#ffffff 0%,#eef1f7 100%);border-radius:22px;padding:10px;box-shadow:0 24px 50px -20px rgba(0,0,0,.7);animation:rise .45s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  svg{width:100%;height:auto;display:block}
  .stall{cursor:pointer}
  .stall rect{fill:#fff;stroke:#26314d;stroke-width:2;transition:fill .18s ease,opacity .25s ease}
  .stall text{fill:#17233b;font-weight:750;pointer-events:none}
  .stall.avail rect{fill:var(--green)}
  .stall.taken rect{fill:var(--red)}
  .stall.avail text,.stall.taken text{fill:#fff}
  .stall:active rect{filter:brightness(.85)}
  body.only-avail .stall:not(.avail){opacity:.18}
  .unit{fill:#41506e;font-size:11.5px;font-weight:600}
  .zone{fill:#edf0f6;stroke:#d9dfea;stroke-width:1.5}
  .zonecap{fill:#8494b3;font-size:13px;font-weight:800;letter-spacing:2.5px}
  .static{pointer-events:none}

  .viewport{overflow:hidden;border-radius:14px;touch-action:none;position:relative;background:#f7f9fc;cursor:grab}
  .viewport:active{cursor:grabbing}
  .zoomer{transform-origin:0 0;will-change:transform}
  .zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:6}
  .zoomctl button{width:40px;height:40px;border-radius:13px;border:1px solid #cfd6e4;background:rgba(255,255,255,.95);font-size:20px;font-weight:800;color:#26314d;box-shadow:0 6px 16px rgba(20,30,60,.22);cursor:pointer;line-height:1}
  .zoomctl button:active{transform:scale(.92);background:#fff}
  .stall rect{transform-box:fill-box;transform-origin:center}
  .stall.pulse rect{animation:pulse .32s var(--ease)}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
  .zoombadge{position:absolute;left:10px;bottom:10px;z-index:6;background:rgba(10,8,6,.78);color:#e8dfc8;font-size:.72rem;font-weight:700;border-radius:99px;padding:5px 10px;opacity:0;transition:opacity .25s;pointer-events:none}
  .zoombadge.show{opacity:1}
  .floorpane{display:none}.floorpane.on{display:block}
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(192,163,95,.35);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .bb-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .legend{display:flex;gap:12px;font-size:.78rem;color:var(--muted);font-weight:600;align-items:center}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .switch{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
  .switch .tr{width:40px;height:23px;border-radius:99px;background:#2e2820;position:relative;transition:background .2s;flex:none}
  .switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#e8e0cd;transition:left .2s var(--ease)}
  .switch.on{color:var(--ink)} .switch.on .tr{background:var(--green)} .switch.on .tr::after{left:20px}
  .reset{background:#1d1913;color:#e8dfc8;border:1px solid #4a3f28;border-radius:99px;padding:8px 15px;font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}
  .reset:active{transform:scale(.96)}
  .hint{text-align:center;color:var(--faint);font-size:.78rem;margin-top:12px;line-height:1.5}
  @media(max-width:560px){ .stat b{font-size:1.3rem} .ttl b{font-size:.95rem} .brandlogo{height:46px} }
  @media(prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>

let tower="t3", floor="4f";
const F={};
const panes=document.getElementById('panes');
Object.entries(FLOORS).forEach(([key,fl])=>{
  const pane=document.createElement('div');
  pane.className='mapcard floorpane'; pane.id='pane-'+key;
  const vp=document.createElement('div'); vp.className='viewport';
  const zm=document.createElement('div'); zm.className='zoomer';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',fl.view);
  svg.innerHTML = fl.deco + '<g class="spots"></g>';
  zm.appendChild(svg); vp.appendChild(zm);
  const zc=document.createElement('div'); zc.className='zoomctl';
  zc.innerHTML='<button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">\u2212</button><button data-z="reset" aria-label="Reset zoom">\u2922</button>';
  vp.appendChild(zc);
  const zb=document.createElement('div'); zb.className='zoombadge'; zb.textContent='Pinch or drag to explore'; vp.appendChild(zb);
  pane.appendChild(vp); panes.appendChild(pane);
  attachZoom(vp,zm,zb);
  const g=svg.querySelector('.spots');
  const els={};
  fl.spots.forEach(([id,label,x,y,w,h,mode])=>{
    const grp=document.createElementNS(NS,'g');
    grp.setAttribute('class','stall'); grp.dataset.spot=id;
    let tr='';
    if(mode==='a1') tr=`rotate(-32 ${x+w/2} ${y+h/2})`;
    if(mode==='a3') tr=`rotate(32 ${x+w/2} ${y+h/2})`;
    if(mode==='a4') tr=`rotate(-10 ${x+w/2} ${y+h/2})`;
    if(tr) grp.setAttribute('transform',tr);
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',h); r.setAttribute('rx',6);
    grp.appendChild(r);
    const t=document.createElementNS(NS,'text');
    const small = fl.view.includes('1600');
    t.setAttribute('x',x+w/2); t.setAttribute('y',y+h/2+(id==='HC'?11:7)); t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size', id==='HC'?(small?24:36):(small?(w<40?15:17):(w<52?21:25)));
    t.textContent = id==='HC' ? '♿' : id;
    grp.appendChild(t); g.appendChild(grp);
    if(label){
      const u=document.createElementNS(NS,'text');
      u.setAttribute('class','unit static');
      if(mode==='side'){ u.setAttribute('x',x+w+8); u.setAttribute('y',y+h/2+4); }
      else if(mode==='left'){ u.setAttribute('x',x-8); u.setAttribute('y',y+h/2+4); u.setAttribute('text-anchor','end'); }
      else if(mode==='a1'){ u.setAttribute('x',x+w/2); u.setAttribute('y',y-10); u.setAttribute('text-anchor','middle'); u.setAttribute('transform',`rotate(-32 ${x+w/2} ${y-10})`); }
      else if(mode==='a3'){ u.setAttribute('x',x+w/2); u.setAttribute('y',y-10); u.setAttribute('text-anchor','middle'); u.setAttribute('transform',`rotate(32 ${x+w/2} ${y-10})`); }
      else if(mode==='a4'){ u.setAttribute('x',x+w+8); u.setAttribute('y',y+h/2+4); }
      else { u.setAttribute('x',x+w/2); u.setAttribute('y',y-8); u.setAttribute('text-anchor','middle'); }
      u.textContent=label; g.appendChild(u);
    }
    els[id]=grp;
    grp.addEventListener('click',()=>cycle(key,id));
  });
  let state={};
  try{ state=JSON.parse(localStorage.getItem(fl.ls)||'{}'); }catch(e){ state={}; }
  if(!Object.keys(state).length) state={...fl.seed};
  F[key]={fl,els,state,ref:null};
});

let __suppressClick=0;
function attachZoom(vp,zm,badge){
  const Z={s:1,tx:0,ty:0};
  const pts=new Map(); let lastDist=0,lastMid=null,moved=false,lastTap=0,downX=0,downY=0;
  function clamp(){
    const vw=vp.clientWidth, vh=vp.clientHeight, cw=zm.offsetWidth, ch=zm.offsetHeight;
    Z.s=Math.min(5,Math.max(1,Z.s));
    const minTx=Math.min(0,vw-cw*Z.s), minTy=Math.min(0,vh-ch*Z.s);
    Z.tx=Math.min(0,Math.max(minTx,Z.tx)); Z.ty=Math.min(0,Math.max(minTy,Z.ty));
    if(Z.s===1){Z.tx=0;Z.ty=0;}
  }
  function apply(){ clamp(); zm.style.transform=`translate(${Z.tx}px,${Z.ty}px) scale(${Z.s})`; }
  function zoomAt(cx,cy,ns){
    const r=vp.getBoundingClientRect(); const mx=cx-r.left,my=cy-r.top;
    const px=(mx-Z.tx)/Z.s, py=(my-Z.ty)/Z.s;
    Z.s=ns; Z.tx=mx-px*Z.s; Z.ty=my-py*Z.s; apply();
    badge.classList.add('show'); clearTimeout(badge._t); badge._t=setTimeout(()=>badge.classList.remove('show'),1400);
  }
  vp._zoom={zoomAt:(f)=>{ const r=vp.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,Z.s*f); }, reset:()=>{ Z.s=1;Z.tx=0;Z.ty=0;apply(); }};
  vp.addEventListener('pointerdown',e=>{
    vp.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ downX=e.clientX; downY=e.clientY; moved=false; }
    if(pts.size===2){ const p=[...pts.values()]; lastDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); lastMid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}; }
  });
  vp.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
      if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>7) moved=true;
      if(moved && Z.s>1){ Z.tx+=dx; Z.ty+=dy; apply(); __suppressClick=Date.now()+300; }
    } else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      const mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
      if(lastDist>0){ zoomAt(mid.x,mid.y,Z.s*(d/lastDist)); Z.tx+=mid.x-lastMid.x; Z.ty+=mid.y-lastMid.y; apply(); }
      lastDist=d; lastMid=mid; moved=true; __suppressClick=Date.now()+300;
    }
  });
  function endPt(e){
    const wasTap = pts.size===1 && !moved;
    pts.delete(e.pointerId);
    if(pts.size<2) lastDist=0;
    if(wasTap){
      const now=Date.now();
      if(now-lastTap<300){ const r=vp.getBoundingClientRect(); if(Z.s>1.05){ vp._zoom.reset(); } else { zoomAt(e.clientX,e.clientY,2.4); } __suppressClick=Date.now()+300; lastTap=0; }
      else lastTap=now;
    }
  }
  vp.addEventListener('pointerup',endPt);
  vp.addEventListener('pointercancel',endPt);
  vp.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,Z.s*(e.deltaY<0?1.15:0.87)); },{passive:false});
  vp.querySelectorAll('.zoomctl button').forEach(b=>{
    b.addEventListener('click',ev=>{ ev.stopPropagation(); const z=b.dataset.z;
      if(z==='in') vp._zoom.zoomAt(1.35); else if(z==='out') vp._zoom.zoomAt(0.74); else vp._zoom.reset(); });
    b.addEventListener('pointerdown',ev=>ev.stopPropagation());
  });
}
function counts(o){ let a=0,t=0; Object.values(o.state).forEach(v=>{ if(v==='avail')a++; else if(v==='taken')t++; }); return [a,t]; }
function paint(key){
  const o=F[key];
  Object.keys(o.els).forEach(k=>{
    const v=o.state[k];
    o.els[k].classList.toggle('avail',v==='avail');
    o.els[k].classList.toggle('taken',v==='taken');
  });
  const [a,t]=counts(o);
  const fnum = key.endsWith('3f') ? '3' : '4';
  if(FLOORS[key].tower===tower) document.getElementById('cnt'+fnum).textContent=a;
  if(key===tower+'-'+floor){
    document.getElementById('cAvail').textContent=a;
    document.getElementById('cTaken').textContent=t;
    document.getElementById('cFree').textContent=Object.keys(o.els).length-a-t;
  }
  try{ localStorage.setItem(o.fl.ls,JSON.stringify(o.state)); }catch(e){}
}
function cycle(key,id){
  if(Date.now()<__suppressClick) return;
  const o=F[key]; const cur=o.state[id];
  const el=o.els[id]; if(el){ el.classList.remove('pulse'); void el.getBoundingClientRect(); el.classList.add('pulse'); }
  if(navigator.vibrate) navigator.vibrate(8);
  const nxt= cur==='avail' ? 'taken' : cur==='taken' ? null : 'avail';
  if(nxt) o.state[id]=nxt; else delete o.state[id];
  paint(key);
  if(o.ref){ const c=o.ref.child(id); nxt? c.set(nxt) : c.remove(); }
}
function show(){
  Object.keys(FLOORS).forEach(k=>{
    document.getElementById('pane-'+k).classList.toggle('on', k===tower+'-'+floor);
  });
  document.getElementById('tw-t3').classList.toggle('on', tower==='t3');
  document.getElementById('tw-t12').classList.toggle('on', tower==='t12');
  document.getElementById('fl-3f').classList.toggle('on', floor==='3f');
  document.getElementById('fl-4f').classList.toggle('on', floor==='4f');
  Object.keys(F).forEach(k=>paint(k));
}
document.getElementById('tw-t3').addEventListener('click',()=>{ tower='t3'; show(); });
document.getElementById('tw-t12').addEventListener('click',()=>{ tower='t12'; show(); });
document.getElementById('fl-3f').addEventListener('click',()=>{ floor='3f'; show(); });
document.getElementById('fl-4f').addEventListener('click',()=>{ floor='4f'; show(); });
document.getElementById('availSwitch').addEventListener('click',function(){
  this.classList.toggle('on'); document.body.classList.toggle('only-avail',this.classList.contains('on'));
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  const key=tower+'-'+floor, o=F[key];
  if(!confirm('Clear ALL marks on this floor — for everyone?')) return;
  o.state={}; paint(key); if(o.ref) o.ref.set(null);
});
Object.keys(F).forEach(k=>paint(k));
show();
function setSync(mode,txt){ const s=document.getElementById('sync'); s.className='sync '+mode; document.getElementById('syncTxt').textContent=txt; }
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database();
  Object.entries(F).forEach(([key,o])=>{
    o.ref=db.ref(o.fl.node);
    o.ref.on('value',snap=>{
      const v=snap.val();
      if(v===null){ if(Object.keys(o.fl.seed).length) o.ref.set(o.fl.seed); o.state={...o.fl.seed}; }
      else o.state=v;
      paint(key);
    });
  });
  db.ref('.info/connected').on('value',s=>{ if(s.val()===true) setSync('live','Live · shared'); else setSync('off','Offline · this phone'); });
}catch(e){ setSync('off','Offline · this phone'); }
