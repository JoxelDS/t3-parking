<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tower 3 · 4th Floor — Valet Parking Map</title>
<meta name="description" content="Interactive valet parking map — Tower 3, 4th floor. Tap a spot: green = available, red = not available. Shared live across devices.">
<style>
  :root{--ink:#17233b;--muted:#5b6b8c;--green:#22b573;--green-d:#12805a;--red:#e5484d;--red-d:#b3272e;--line:#26314d;--bg:#0d1526;--panel:#131f38}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#eef2fa;min-height:100vh}
  header{padding:14px 16px 10px;text-align:center}
  h1{font-size:1.25rem;font-weight:800;letter-spacing:.02em}
  h1 span{color:#7ea4ff}
  .sub{color:#9fb0d0;font-size:.85rem;margin-top:2px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px 12px 4px}
  .chip{background:var(--panel);border:1px solid #26355a;border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
  .dot.g{background:var(--green)} .dot.r{background:var(--red)} .dot.n{background:#fff;border:1px solid #8894ad}
  #sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:#9fb0d0}
  #syncDot{width:9px;height:9px;border-radius:50%;background:#f5b83d}
  #syncDot.live{background:#2ee59d;box-shadow:0 0 8px #2ee59d}
  #syncDot.off{background:#e5484d}
  button.reset{background:#1d2c4d;color:#dbe6ff;border:1px solid #33477a;border-radius:99px;padding:7px 14px;font-size:.85rem;font-weight:700;cursor:pointer}
  button.reset:active{transform:scale(.97)}
  .hint{text-align:center;color:#8494b5;font-size:.8rem;padding:2px 12px 8px}
  .mapwrap{max-width:1100px;margin:0 auto;padding:4px 8px 26px}
  .mapcard{background:#f7f9fc;border-radius:14px;padding:8px;box-shadow:0 18px 40px -18px rgba(0,0,0,.65)}
  svg{width:100%;height:auto;display:block}
  .stall{cursor:pointer}
  .stall rect{fill:#ffffff;stroke:var(--line);stroke-width:2;transition:fill .15s ease}
  .stall text{fill:var(--ink);font-weight:700;pointer-events:none}
  .stall.avail rect{fill:var(--green)}
  .stall.taken rect{fill:var(--red)}
  .stall.avail text,.stall.taken text{fill:#ffffff}
  .stall:active rect{filter:brightness(.88)}
  .unit{fill:#41506e;font-size:11.5px;font-weight:600}
  .unit.light{fill:#5b6b8c}
  .static{pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>Tower 3 · <span>4th Floor</span> — Valet Parking</h1>
  <div class="sub">St Tropez by the Bay · Gold Coast Parking</div>
</header>

<div class="bar">
  <span class="chip"><span class="dot g"></span><span id="cAvail">0</span> available</span>
  <span class="chip"><span class="dot r"></span><span id="cTaken">0</span> not available</span>
  <span class="chip"><span class="dot n"></span><span id="cFree">0</span> unmarked</span>
  <button class="reset" id="resetBtn">Reset all</button>
  <span id="sync"><span id="syncDot"></span><span id="syncTxt">connecting…</span></span>
</div>
<p class="hint">Tap a spot: <b style="color:#2ee59d">green = available</b> · tap again: <b style="color:#ff8589">red = not available</b> · tap again: clear. Everyone with this link sees the same map, live.</p>

<div class="mapwrap"><div class="mapcard">
<svg viewBox="0 0 1240 880" role="img" aria-label="Tower 3 fourth floor parking map">
  <!-- caution banner -->
  <g class="static">
    <defs><pattern id="hz" width="16" height="26" patternUnits="userSpaceOnUse"><rect width="16" height="26" fill="#f7c948"/><rect width="8" height="26" fill="#141414"/></pattern></defs>
    <rect x="375" y="212" width="380" height="26" fill="url(#hz)"/>
    <text x="565" y="262" text-anchor="middle" font-size="21" font-weight="800" fill="#e5484d" letter-spacing="1">VALET PLEASE DRIVE SLOW 5mph</text>
  </g>
  <!-- title -->
  <g class="static">
    <text x="1135" y="335" text-anchor="middle" font-size="42" font-weight="800" fill="#2b3a8f">4th Floor</text>
    <text x="1135" y="382" text-anchor="middle" font-size="42" font-weight="800" fill="#2b3a8f">Tower 3</text>
  </g>
  <!-- elevator -->
  <g class="static" transform="rotate(28 470 495)">
    <rect x="415" y="455" width="115" height="82" fill="#d5d9e0"/>
    <text x="472" y="492" text-anchor="middle" font-size="24" font-weight="700" fill="#3c465c">Elev</text>
    <text x="472" y="522" text-anchor="middle" font-size="26" font-weight="800" fill="#3c465c">T3</text>
  </g>
  <!-- handicap stall (decorative, as drawn on the map) -->
  <g class="static" transform="rotate(-32 300 415)">
    <rect x="268" y="368" width="58" height="96" fill="#ffffff" stroke="#26314d" stroke-width="2"/>
    <text x="297" y="432" text-anchor="middle" font-size="40" fill="#2456c8">♿</text>
  </g>
  <text class="unit static" x="868" y="392">T2-1003</text>
  <g id="spots"></g>
</svg>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const SEED = {"186":"avail","196":"avail","197":"avail","198":"avail","199":"avail","200":"avail","209":"avail","211":"avail","227":"avail","190":"taken","233":"taken"};
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDNR9PxjVAAEfCP5mJFV2HrU_YALZ01mMw",
  authDomain: "t3-valet-parking.firebaseapp.com",
  databaseURL: "https://t3-valet-parking-default-rtdb.firebaseio.com",
  projectId: "t3-valet-parking",
  storageBucket: "t3-valet-parking.firebasestorage.app",
  messagingSenderId: "877941758797",
  appId: "1:877941758797:web:7af2c8983d1a179c197504"
};
const SPOTS = [
 // top row (left to right): [num, unit, x, y, w, h, numY]
 ...[205,204,203,202,201,200,199,198,197,196,195,194,193,192,191,190,189,188,187,186].map((n,i)=>[n,["1502","1501","1406","1405","1404","1403","1402","1401","1006","1005","1004","1003","1002","1001","906","905","904","903","902","901"][i],105+i*57.5,92,56,98]),
 // left column (top to bottom)
 ...[206,207,208,209,210,211,212,213,214].map((n,i)=>[n,["1503","1504","1505","1506","1801","1802","1803","1804","1805"][i],18,232+i*60,66,52,"side"]),
 // middle row
 ...[219,220,221,222,223,224,225].map((n,i)=>[n,["502","503","TS06","504","TS05","505","506"][i],465+i*57.5,300,56,86]),
 // right column
 ...[227,228,229,230].map((n,i)=>[n,["TS04","TS03","TS02","TS01"][i],700,478+i*64,80,56,"side"]),
 // bottom row
 ...[231,232,233,234,235].map((n,i)=>[n,["605","604","603","H207","601"][i],742+i*57.5,718,56,84]),
 // singles
 [216,"H409",212,518,80,48,"left"],[215,"1806",258,566,80,48,"left"],
 [217,"H408",318,352,56,98,"angle1"],[218,"H407",382,330,56,98,"angle2"],[226,"501",762,398,56,92,"angle3"]
];
const NS="http://www.w3.org/2000/svg";
const g=document.getElementById('spots');
const els={};
SPOTS.forEach(([num,unit,x,y,w,h,mode])=>{
  const grp=document.createElementNS(NS,'g');
  grp.setAttribute('class','stall'); grp.dataset.spot=num;
  let transform='';
  if(mode==='angle1') transform=`rotate(-32 ${x+w/2} ${y+h/2})`;
  if(mode==='angle2') transform=`rotate(-32 ${x+w/2} ${y+h/2})`;
  if(mode==='angle3') transform=`rotate(32 ${x+w/2} ${y+h/2})`;
  if(transform) grp.setAttribute('transform',transform);
  const r=document.createElementNS(NS,'rect');
  r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',h);
  grp.appendChild(r);
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',x+w/2); t.setAttribute('y',y+h/2+9); t.setAttribute('text-anchor','middle');
  t.setAttribute('font-size', w<60?24:26); t.textContent=num;
  grp.appendChild(t);
  g.appendChild(grp);
  const u=document.createElementNS(NS,'text');
  u.setAttribute('class','unit static');
  if(mode==='side'){ u.setAttribute('x',x+w+8); u.setAttribute('y',y+h/2+4); }
  else if(mode==='left'){ u.setAttribute('x',x-8); u.setAttribute('y',y+h/2+4); u.setAttribute('text-anchor','end'); }
  else if(mode==='angle1'||mode==='angle2'){ u.setAttribute('x',x+w/2); u.setAttribute('y',y-10); u.setAttribute('text-anchor','middle'); if(transform) u.setAttribute('transform',`rotate(-32 ${x+w/2} ${y-10})`); }
  else if(mode==='angle3'){ u.setAttribute('x',x+w/2); u.setAttribute('y',y-10); u.setAttribute('text-anchor','middle'); u.setAttribute('transform',`rotate(32 ${x+w/2} ${y-10})`); }
  else { u.setAttribute('x',x+w/2); u.setAttribute('y',y-8); u.setAttribute('text-anchor','middle'); }
  u.textContent='T3-'+unit;
  g.appendChild(u);
  els[num]=grp;
  grp.addEventListener('click',()=>cycle(String(num)));
});
let state={};
try{ state=JSON.parse(localStorage.getItem('t3-4f-state')||'{}'); }catch(e){ state={}; }
if(!Object.keys(state).length) state={...SEED};
function paint(){
  let a=0,t=0;
  Object.keys(els).forEach(k=>{
    const v=state[k];
    els[k].classList.toggle('avail',v==='avail');
    els[k].classList.toggle('taken',v==='taken');
    if(v==='avail')a++; else if(v==='taken')t++;
  });
  document.getElementById('cAvail').textContent=a;
  document.getElementById('cTaken').textContent=t;
  document.getElementById('cFree').textContent=Object.keys(els).length-a-t;
  try{ localStorage.setItem('t3-4f-state',JSON.stringify(state)); }catch(e){}
}
paint();
let db=null, ref=null;
function setSync(mode,txt){ const d=document.getElementById('syncDot'); d.className=mode; document.getElementById('syncTxt').textContent=txt; }
try{
  if(typeof FIREBASE_CONFIG!=='undefined' && FIREBASE_CONFIG.apiKey){
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database(); ref=db.ref('t3-4f/spots');
    ref.on('value',snap=>{
      const v=snap.val();
      if(v===null){ ref.set(SEED); state={...SEED}; }
      else state=v;
      paint(); setSync('live','live — shared');
    },err=>setSync('off','offline — this phone only'));
    db.ref('.info/connected').on('value',s=>{ if(s.val()===true) setSync('live','live — shared'); else setSync('off','offline — this phone only'); });
  } else setSync('off','this phone only');
}catch(e){ setSync('off','this phone only'); }
function cycle(num){
  const cur=state[num];
  const nxt= cur==='avail' ? 'taken' : cur==='taken' ? null : 'avail';
  if(nxt) state[num]=nxt; else delete state[num];
  paint();
  if(ref){ const c=ref.child(num); nxt? c.set(nxt) : c.remove(); }
}
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('Clear ALL marks on the map for everyone?')) return;
  state={}; paint();
  if(ref) ref.set(null);
});
</script>
</body>
</html>
